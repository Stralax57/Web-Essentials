<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lijsten in HTML</title>
  </head>
  <body>
    <p>Unordered list</p>
    <ul>
      <li>one</li>
      <li>dva</li>
      <li>tres</li>
    </ul>
    <p>Ordered list</p>
    <ol>
      <li>een</li>
      <li>i</li>
      <li>drei</li>
    </ol>
    <p>Nested list</p>
    <ul>
      <li>Element</li>
      <ul>
        <li>attribuut 1</li>
      </ul>
      <li>el2</li>
      <ol>
        <li>attribuut</li>
        <li>attribuut</li>
      </ol>
    </ul>
  </body>
</html>
