<!-- DOCTYPE geeft aan de browser door dat dit een HTML5 document is -->
<!DOCTYPE html>

<html lang="nl"> <!-- taal selecteren-->

  <head>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Titel in de tab van de browser</title> 
    
    <!-- Koppeling met extern CSS-bestand -->
    <link rel="stylesheet" href="style.css" />

  </head>


  <body>

    <!-- Alles binnen de body is zichtbaar in de browser viewport -->
    <h1>Mijn Eerste Pagina</h1>
    <p>Welkom op mijn website.</p>

    <!-- Koppeling met extern JS-bestand -->
    <script src="main.js"></script>

  </body>

</html>
